name: Generate Docs

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: setup mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.10.21

      - name: bundle install
        run: |
          bundle install

      - name: Generate docs
        run: |
          rm -f doc/index.db
          rdoc --format=markdown lib/fusionauth/fusionauth_client.rb

      - name: Commit
        uses: EndBug/add-and-commit@v9
        with:
          add: 'doc/'
          message: ':memo: Updating docs'
